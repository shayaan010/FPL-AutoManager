<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f1420;
        color: #e7ecf5;
        padding: 14px;
        margin: 0;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      p {
        font-size: 12px;
        color: #8b96ac;
        margin: 0 0 12px;
        line-height: 1.4;
      }
      button {
        width: 100%;
        background: #5b8def;
        color: #0a1530;
        border: none;
        border-radius: 6px;
        padding: 10px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.4;
      }
      #status.error {
        color: #e05f5f;
      }
      #status.success {
        color: #2fbf71;
      }
      .advanced {
        margin-top: 12px;
        font-size: 11px;
        color: #5f6a82;
      }
      .advanced input {
        width: 100%;
        box-sizing: border-box;
        background: #171d2c;
        border: 1px solid #2a3243;
        border-radius: 6px;
        padding: 6px 8px;
        color: #e7ecf5;
        font-size: 12px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>FPL Auto-Manager</h1>
    <p>Connects the FPL account you're already signed into in this browser.</p>

    <button id="connect-btn">Connect</button>
    <div id="status"></div>

    <div class="advanced">
      App URL
      <input id="backend-url" type="text" value="http://localhost:8010" />
    </div>

    <script src="popup.js"></script>
  </body>
</html>
